name: Plan requirement

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  plan-gate:
    name: Plan gate
    runs-on: ubuntu-latest

    steps:
      - name: Validate PR plan
        shell: python
        run: |
          import json
          import os
          import re
          import sys

          with open(os.environ["GITHUB_EVENT_PATH"]) as file:
              event = json.load(file)

          body = event["pull_request"].get("body") or ""

          required_sections = [
              "Plan",
              "Scope",
              "Validation",
          ]

          missing = []

          for section in required_sections:
              pattern = (
                  rf"^## {re.escape(section)}[ \t]*\r?\n"
                  rf"(.*?)(?=^## |\Z)"
              )
              match = re.search(
                  pattern, body, re.MULTILINE | re.DOTALL
              )

              content = match.group(1).strip() if match else ""
              content = re.sub(
                  r"<!--.*?-->", "", content, flags=re.DOTALL
              ).strip()

              if content.lower() in {"", "todo", "tbd"}:
                  missing.append(section)

          if missing:
              print(
                  "::error::Add meaningful content under: "
                  + ", ".join(missing)
              )
              sys.exit(1)

          print("Required plan sections are populated.")
