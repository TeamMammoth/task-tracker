name: Secret boundary demo

on:
  workflow_dispatch:

permissions: {}

jobs:
  demo:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Step without the secret
        run: |
          test -z "$DEMO_API_KEY"
          echo "This step has no API key."

      - name: Component that needs the secret
        env:
          DEMO_API_KEY: ${{ secrets.DEMO_API_KEY }}
        run: |
          test -n "$DEMO_API_KEY"
          echo "API key received at runtime."

      - name: Another step without the secret
        run: |
          test -z "$DEMO_API_KEY"
          echo "This step has no API key."